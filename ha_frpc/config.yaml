name: "FRP Client"
version: "1.0.2"
slug: ha_frpc

description: >-
  Securely expose your Home Assistant over the internet via FRP (Fast Reverse Proxy).

arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

host_network: true
startup: application
boot: auto
init: false

map:
  - type: share
    read_only: false
  - type: ssl
    read_only: true

privileged:
  - NET_ADMIN

devices:
  - /dev/net/tun
